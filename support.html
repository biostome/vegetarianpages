  <p>使用「素食」App 遇到问题？我们很乐意帮助您。</p>

  <h2>常见问题</h2>
  <dl class="faq">
    <dt>Q: 为什么搜索不到店铺？</dt>
    <dd>A: 请确保已授权位置权限，并检查网络连接。数据来源于高德地图，部分城市可能覆盖不全。</dd>

    <dt>Q: 店铺信息不准确怎么办？</dt>
    <dd>A: 店铺数据来自高德地图，您可以提交 Issue 反馈，我们会定期同步更新。</dd>

    <dt>Q: 如何清除缓存？</dt>
    <dd>A: 进入「设置」→「清除离线缓存」即可。缓存有效期 7 天，过期自动清理。</dd>

    <dt>Q: 支持哪些语言？</dt>
    <dd>A: 支持简体中文、繁體中文、English，在「设置」中切换。</dd>
  </dl>
